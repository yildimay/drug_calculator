[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drug_calculator"
version = "0.1.0"
description = "SMILES in, a drug-likeness screen and a DFT method recommendation out"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "rdkit>=2025.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.150.0",
]

[project.scripts]
drugcalculator = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "dft"]
